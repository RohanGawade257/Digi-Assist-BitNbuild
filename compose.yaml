name: digital-assistant
services:
  mongo:
    image: mongo:8.0.20@sha256:098862b1339f031900ca66cf8fef799e616d6324fa41b9a263f2ec899552c1ef
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Run scripts/setup-local.ps1}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Run scripts/setup-local.ps1}
    ports:
      - '127.0.0.1:${MONGO_PORT:-27018}:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD-SHELL', 'mongosh --quiet --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"']
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_FILTER: '@guide/api'
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/digital_assistant?authSource=admin
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin.json
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-http://localhost:3000}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_API_KEY_1: ${GEMINI_API_KEY_1:-}
      GEMINI_API_KEY_2: ${GEMINI_API_KEY_2:-}
      GEMINI_API_KEY_3: ${GEMINI_API_KEY_3:-}
      GEMINI_API_KEY_4: ${GEMINI_API_KEY_4:-}
      GEMINI_QUOTA_GROUP_1: ${GEMINI_QUOTA_GROUP_1:-gemini-main}
      GEMINI_QUOTA_GROUP_2: ${GEMINI_QUOTA_GROUP_2:-gemini-main}
      GEMINI_QUOTA_GROUP_3: ${GEMINI_QUOTA_GROUP_3:-gemini-main}
      GEMINI_QUOTA_GROUP_4: ${GEMINI_QUOTA_GROUP_4:-gemini-main}
      SARVAM_API_KEY_1: ${SARVAM_API_KEY_1:-}
      SARVAM_API_KEY_2: ${SARVAM_API_KEY_2:-}
      SARVAM_API_KEY_3: ${SARVAM_API_KEY_3:-}
      SARVAM_QUOTA_GROUP_1: ${SARVAM_QUOTA_GROUP_1:-sarvam-main}
      SARVAM_QUOTA_GROUP_2: ${SARVAM_QUOTA_GROUP_2:-sarvam-main}
      SARVAM_QUOTA_GROUP_3: ${SARVAM_QUOTA_GROUP_3:-sarvam-main}
      SARVAM_TRANSLATION_MODEL: ${SARVAM_TRANSLATION_MODEL:-sarvam-translate:v1}
      QUOTA_POLICY_PATH: /app/config/quota-policy.json
    volumes:
      - ./secrets:/run/secrets:ro
      - ./config:/app/config:ro
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3001/api/v1/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_FILTER: '@guide/web'
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001/api/v1}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
volumes:
  mongo_data:
